<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Namoro Virtual IA | Conexões Reais</title>
  <script src="audio_data.js"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Inter"', 'sans-serif'],
          },
          colors: {
            app: {
              flame: '#FE3C72',
              coral: '#FF655B',
              superlike: '#1786FF',
              dark: '#0B0E14',
              surface: '#151922',
              card: '#1C222E',
              border: '#273142'
            }
          },
          animation: {
            'slide-down': 'slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'fade-in': 'fadeIn 0.25s ease-out forwards',
            'pulse-soft': 'pulseSoft 2s infinite ease-in-out',
            'bounce-subtle': 'bounceSubtle 1.8s infinite ease-in-out',
            'shimmer': 'shimmer 2s infinite linear',
          },
          keyframes: {
            slideDown: {
              '0%': { transform: 'translateY(-100%)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            fadeIn: {
              '0%': { opacity: '0', transform: 'scale(0.98)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            pulseSoft: {
              '0%, 100%': { transform: 'scale(1)', opacity: '1' },
              '50%': { transform: 'scale(1.03)', opacity: '0.9' },
            },
            bounceSubtle: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-4px)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            }
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: auto;
    }
    body {
      background-color: #07090E;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .card-transition {
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2), opacity 0.35s ease-out;
    }
    .card-dragging {
      transition: none !important;
      cursor: grabbing;
    }

    /* Gradients */
    .grad-brand {
      background: linear-gradient(135deg, #FE3C72 0%, #FF655B 100%);
    }
    .grad-match {
      background: linear-gradient(135deg, #FF3366 0%, #8A2BE2 100%);
    }
    .grad-overlay {
      background: linear-gradient(to top, rgba(11, 14, 20, 0.98) 0%, rgba(11, 14, 20, 0.7) 40%, rgba(11, 14, 20, 0.1) 75%, transparent 100%);
    }

    /* Waveform visual */
    .waveform-bar {
      width: 3px;
      border-radius: 3px;
      background-color: #FE3C72;
      transition: height 0.15s ease;
    }

    /* Stamp badges */
    .stamp-badge {
      border-width: 4px;
      letter-spacing: 2px;
      font-weight: 900;
      text-transform: uppercase;
      border-radius: 12px;
      pointer-events: none;
      transition: opacity 0.1s linear;
    }
  </style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex justify-center items-center md:p-4 select-none">

  <!-- Mobile App Frame -->
  <main id="app-container" class="w-full max-w-md h-[100dvh] md:h-[844px] md:max-h-[900px] md:rounded-[44px] bg-[#0B0E14] text-white shadow-[0_0_60px_rgba(254,60,114,0.18)] relative overflow-hidden flex flex-col border border-neutral-800">

    <!-- Push Notification Overlay (Banner que desce com som e vibração simulada) -->

        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between mb-0.5">
            <div class="flex items-center space-x-1.5">
              <span id="push-name" class="font-extrabold text-sm text-white truncate">Larissa</span>
              <span class="text-[10px] px-1.5 py-0.2 rounded-full bg-pink-500/20 text-pink-400 font-bold">DEU MATCH!</span>
            </div>
            <span class="text-[10px] text-neutral-400 font-medium">agora</span>
          </div>
          <p id="push-message" class="text-xs text-neutral-200 truncate">Oi! Vi que você curtiu meu perfil... 🥰</p>
        </div>
      </div>
      <div class="mt-2 pt-1.5 border-t border-white/5 flex items-center justify-between text-[11px] text-pink-400 font-bold px-1">

        <svg class="w-4 h-4 animate-bounce-subtle" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
        </svg>
      </div>
    </div>

    <!-- Match Celebration Modal (Mini Popup não-bloqueante) -->

        </div>
      </div>

      <div class="w-full space-y-2.5 max-w-xs">
        <button onclick="goToChatDirect()" class="w-full py-4 px-6 rounded-2xl font-extrabold text-white text-base tracking-wide grad-brand shadow-xl shadow-pink-600/30 hover:opacity-95 active:scale-95 transition-all flex items-center justify-center space-x-2">
          <span>CONVERSAR COM ELA AGORA</span>

    <!-- ============================================== -->
    <!-- ABA 1: FEED DE PERFIS (SWIPE DECK)             -->

    <section id="view-deck" class="flex-1 flex flex-col h-full relative z-10 overflow-hidden">

      <header class="px-5 py-3 flex items-center justify-between border-b border-neutral-800/80 bg-[#0B0E14]/90 backdrop-blur-md z-20">
        <div class="flex items-center space-x-2">
          <svg class="w-7 h-7 text-[#FE3C72]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.67 1.25C12.3 0.94 11.75 1.09 11.57 1.55C10.75 3.65 9.77 5.75 8.24 7.42C6.17 9.68 4 12.06 4 15.22C4 19.53 7.58 23 12 23C16.42 23 20 19.53 20 15.22C20 11.36 17.5 8.2 15.1 5.37C14.37 4.5 13.62 3.61 12.96 2.68C12.75 2.38 12.56 1.87 12.67 1.25Z"/>

        </div>

        <!-- Gender Filter Chips -->
        <div class="flex items-center bg-[#151922] p-1 rounded-xl border border-neutral-800 text-[11px] font-bold">
          <button id="chip-mulher" onclick="setGenderFilter('mulher')" class="px-2.5 py-1 rounded-lg bg-[#FE3C72] text-white transition-all">Mulheres</button>
          <button id="chip-homem" onclick="setGenderFilter('homem')" class="px-2.5 py-1 rounded-lg text-neutral-400 hover:text-white transition-all">Homens</button>
        </div>
      </header>

      <!-- Tinder Stack Arena -->
      <div id="deck-viewport" class="flex-1 relative mx-3 my-2 rounded-3xl overflow-hidden select-none bg-[#121620]">

      </div>

      <!-- Action Buttons Bar -->
      <footer class="px-6 pt-2 pb-5 flex items-center justify-around z-20 bg-gradient-to-t from-[#0B0E14] via-[#0B0E14]/90 to-transparent">
        <!-- Undo Button -->
        <button onclick="handleUndo()" title="Desfazer" class="w-12 h-12 rounded-full bg-[#181E29] border border-neutral-700/80 text-amber-400 flex items-center justify-center shadow-lg active:scale-95 transition-all">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a5 5 0 015 5v2m-15-7l4-4m-4 4l4 4"/>
          </svg>
        </button>

        <!-- Nope Button -->
        <button onclick="triggerSwipeAction('nope')" title="Passar" class="w-16 h-16 rounded-full bg-[#181E29] border-2 border-rose-500/40 text-rose-500 flex items-center justify-center shadow-xl shadow-rose-950/30 hover:scale-105 active:scale-95 transition-all">

            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>

        </button>

        <!-- Like Button -->
        <button onclick="triggerSwipeAction('like')" title="Curtir" class="w-16 h-16 rounded-full grad-brand text-white flex items-center justify-center shadow-xl shadow-pink-600/40 hover:scale-105 active:scale-95 transition-all">

            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41 0.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </button>

        <!-- Direct Chat Shortcut Button -->
        <button onclick="switchToTab('chats')" title="Mensagens" class="relative w-12 h-12 rounded-full bg-[#181E29] border border-neutral-700/80 text-pink-400 flex items-center justify-center shadow-lg active:scale-95 transition-all">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
          <span id="nav-chat-badge" class="hidden absolute -top-1 -right-1 w-5 h-5 rounded-full bg-emerald-500 text-[10px] font-black text-black flex items-center justify-center border-2 border-[#0B0E14] animate-pulse">
            1
          </span>
        </button>
      </footer>
    </section>

    <!-- ============================================== -->
    <!-- ABA 2: LISTA DE CONVERSAS (INBOX ESTILO WHATS) -->
    <!-- ============================================== -->
    <section id="view-inbox" class="flex-1 hidden flex flex-col h-full relative z-10 bg-[#0B0E14]">
      <!-- Header Inbox -->
      <header class="px-5 py-4 border-b border-neutral-800 flex items-center justify-between">
        <div>
          <h2 class="text-xl font-black text-white">Conversas</h2>
          <span class="text-xs text-neutral-400">Pessoas que deram match com você</span>
        </div>
        <button onclick="switchToTab('deck')" class="px-3 py-1.5 rounded-xl bg-[#181E29] text-xs font-bold text-pink-400 hover:text-white transition-colors flex items-center gap-1">
          <span>Explorar Mais</span>
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
      </header>

      <!-- Matches Horizontal Carousel -->
      <div class="p-4 border-b border-neutral-800/80">
        <span class="text-[11px] font-bold uppercase tracking-wider text-neutral-400 block mb-2.5">Novos Matches</span>
        <div id="matches-carousel" class="flex space-x-3 overflow-x-auto pb-1">
          <!-- Injected dynamically -->
        </div>
      </div>

      <!-- Chats List -->
      <div id="inbox-list" class="flex-1 overflow-y-auto divide-y divide-neutral-900">
        <!-- Injected dynamically -->
      </div>

    <!-- ABA 3: TELA DE CHAT ATIVA (INTERATIVA E REAL) -->

    <section id="view-chat" class="flex-1 hidden flex flex-col h-full relative z-20 bg-[#0B0E14]">
      
      <!-- Top Chat Header -->
      <header class="px-4 py-3 bg-[#131722] border-b border-neutral-800 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
          <button onclick="switchToTab('chats')" class="p-1.5 -ml-1 text-neutral-400 hover:text-white">

            <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-500 border-2 border-[#131722]"></span>
          </div>

          <div>
            <h3 id="chat-header-name" class="font-extrabold text-sm text-white flex items-center gap-1.5">

            <span id="chat-header-status" class="text-[11px] text-emerald-400 font-medium flex items-center gap-1">

          </div>
        </div>

        <!-- Fast Actions: Audio / Call Mockup -->
        <div class="flex items-center space-x-1">
          <button onclick="playPersonaAudioCurrent()" class="p-2 rounded-full bg-[#1F2636] text-pink-400 hover:text-white transition-colors" title="Ouvir áudio">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Chat Messages Scroll Area -->
      <div id="chat-messages-container" class="flex-1 p-4 overflow-y-auto space-y-3.5 bg-gradient-to-b from-[#0B0E14] to-[#0F131D]">
        <!-- Dynamic Chat History -->
      </div>

      <!-- Suggested Interactive Quick Replies -->
      <div id="quick-replies-container" class="px-4 py-2 bg-[#131722]/90 border-t border-neutral-800/80 flex space-x-2 overflow-x-auto">
        <!-- Quick replies generated dynamically -->
      </div>

      <!-- Bottom Input Field -->
      <footer class="p-3 bg-[#131722] border-t border-neutral-800 flex items-center space-x-2">
        <input type="text" id="chat-input" placeholder="Digite uma mensagem..." class="flex-1 px-4 py-2.5 rounded-full bg-[#0B0E14] border border-neutral-800 text-white placeholder-neutral-500 text-sm focus:outline-none focus:border-pink-500" onkeydown="if(event.key==='Enter') sendCustomMessage()">

          <svg class="w-5 h-5 transform rotate-45 -ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </footer>
    </section>

    <!-- Bottom Navigation Bar (Sempre visível para sensação de app completo) -->
    <nav class="h-14 bg-[#0B0E14] border-t border-neutral-800/80 flex items-center justify-around z-30">
      <button id="nav-btn-deck" onclick="switchToTab('deck')" class="flex flex-col items-center justify-center text-pink-500 transition-colors">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.67 1.25C12.3 0.94 11.75 1.09 11.57 1.55C10.75 3.65 9.77 5.75 8.24 7.42C6.17 9.68 4 12.06 4 15.22C4 19.53 7.58 23 12 23C16.42 23 20 19.53 20 15.22C20 11.36 17.5 8.2 15.1 5.37C14.37 4.5 13.62 3.61 12.96 2.68C12.75 2.38 12.56 1.87 12.67 1.25Z"/>
        </svg>
        <span class="text-[10px] font-bold mt-0.5">Explorar</span>
      </button>

      <button id="nav-btn-chats" onclick="switchToTab('chats')" class="relative flex flex-col items-center justify-center text-neutral-400 hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <span class="text-[10px] font-bold mt-0.5">Conversas</span>
        <span id="nav-bottom-badge" class="hidden absolute top-0 right-3 w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      </button>
    </nav>

  </main>

  <!-- ============================================== -->
  <!-- JAVASCRIPT: LOGICA, DIALOGOS & AUDIO SYNTH     -->
  <!-- ============================================== -->
  <script>
    /* ---------------------------------------------
       1. PERSONAS COMPLETAS E ÁRVORES DE DIÁLOGO
       --------------------------------------------- */

    /* Sound Synthesizer com áudios realistas */
    function playSfx(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'pop') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.08);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'match') {
          // Double chime alegre
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.08);
            gain.gain.setValueAtTime(0.15, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.25);
          });
        } else if (type === 'push') {
          // Notificação clássica tipo iOS
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.setValueAtTime(880.00, now + 0.1); // A5
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'send') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(700, now + 0.09);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        }
      } catch (e) {}
    }

    /* ---------------------------------------------
       4. MECÂNICA DE SWIPE NATIVO E MATCH INSTANTÂNEO
       --------------------------------------------- */
    function setupCardDrag(cardEl, persona) {
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let currentY = 0;

      const stampLike = cardEl.querySelector('.stamp-like');
      const stampNope = cardEl.querySelector('.stamp-nope');

      const onStart = (cx, cy) => {
        isDragging = true;
        startX = cx;
        startY = cy;
        cardEl.classList.add('card-dragging');
        cardEl.classList.remove('card-transition');
      };

      const onMove = (cx, cy) => {
        if (!isDragging) return;
        currentX = cx - startX;
        currentY = cy - startY;
        const rotate = currentX * 0.08;
        cardEl.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

        if (currentX > 20) {
          stampLike.style.opacity = Math.min((currentX - 20) / 90, 1);
          stampNope.style.opacity = 0;
        } else if (currentX < -20) {
          stampNope.style.opacity = Math.min((-currentX - 20) / 90, 1);
          stampLike.style.opacity = 0;
        } else {
          stampLike.style.opacity = 0;
          stampNope.style.opacity = 0;
        }
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        cardEl.classList.remove('card-dragging');
        cardEl.classList.add('card-transition');

        if (currentX > 90) {
          executeSwipe(cardEl, persona, 'like');
        } else if (currentX < -90) {
          executeSwipe(cardEl, persona, 'nope');
        } else {
          cardEl.style.transform = 'translate(0px, 0px) rotate(0deg)';
          stampLike.style.opacity = 0;
          stampNope.style.opacity = 0;
        }
      };

      cardEl.addEventListener('pointerdown', e => {
        if (e.target.closest('button') || e.target.closest('.pointer-events-auto')) return;
        onStart(e.clientX, e.clientY);
      });
      window.addEventListener('pointermove', e => { if (isDragging) onMove(e.clientX, e.clientY); });
      window.addEventListener('pointerup', () => { if (isDragging) onEnd(); });
      window.addEventListener('pointercancel', () => { if (isDragging) onEnd(); });
    }

    let isSwipeLocked = false;
    function executeSwipe(cardEl, persona, action) {
      if (isSwipeLocked) return;
      isSwipeLocked = true;
      swipedHistory.push({ persona, action });

      const stampLike = cardEl.querySelector('.stamp-like');
      const stampNope = cardEl.querySelector('.stamp-nope');

      if (action === 'like') {
        stampLike.style.opacity = 1;
        cardEl.style.transform = `translate(${window.innerWidth + 200}px, 40px) rotate(35deg)`;
        playSfx('pop');
        
        // Registra o Match e inicializa conversa
        handleNewMatch(persona);
      } else {
        stampNope.style.opacity = 1;
        cardEl.style.transform = `translate(${-window.innerWidth - 200}px, 40px) rotate(-35deg)`;
        playSfx('pop');
      }

      setTimeout(() => {
        currentDeckIndex++;
        isSwipeLocked = false;
        renderDeck();
      }, 320);
    }

    function triggerSwipeAction(action) {
      const top = currentDeck[currentDeckIndex];
      if (!top) return;
      const cardEl = document.getElementById(`card-${top.id}`);
      if (cardEl) executeSwipe(cardEl, top, action);
    }

    function handleUndo() {
      if (swipedHistory.length === 0 || currentDeckIndex === 0) return;
      const last = swipedHistory.pop();
      if (last.action === 'like') {
        myMatches = myMatches.filter(p => p.id !== last.persona.id);
        updateInboxBadges();
      }
      currentDeckIndex--;
      playSfx('pop');
      renderDeck();
    }

    /* ---------------------------------------------
       5. GATILHO DE MATCH, PUSH E NOTIFICAÇÃO VIVA
       --------------------------------------------- */
    function handleNewMatch(persona) {
      if (!myMatches.find(p => p.id === persona.id)) {
        myMatches.unshift(persona);
      }

      // Inicializa histórico de conversa com a primeira mensagem se novo
      if (!chatHistories[persona.id]) {
        chatHistories[persona.id] = [
          {
            sender: 'persona',
            text: persona.firstMessage,
            time: 'Agora',
            isAudio: true,
            audioDuration: persona.audioDuration,
            audioFile: persona.audioFile,
            audioText: persona.audioText
          }
        ];
      }

      updateInboxBadges();

      // RITMO DINÂMICO: Após 600ms, toca chime de Match e exibe a Push Notification no topo
      setTimeout(() => {
        playSfx('match');
        triggerPushNotification(persona);
      }, 600);
    }

    function triggerPushNotification(persona) {
      playSfx('push');
      const pushEl = document.getElementById('push-notification');
      document.getElementById('push-avatar').src = persona.photo;
      document.getElementById('push-name').innerText = persona.name;
      document.getElementById('push-message').innerText = persona.firstMessage;

      pushEl.classList.remove('hidden');
      activeChatPersona = persona;

      // Oculta automaticamente após 6 segundos se não clicado
      setTimeout(() => {
        if (!pushEl.classList.contains('hidden')) {
          pushEl.classList.add('hidden');
        }
      }, 6000);
    }

    function openChatFromNotification() {
      document.getElementById('push-notification').classList.add('hidden');
      if (activeChatPersona) {
        openChat(activeChatPersona);
      }
    }

    function updateInboxBadges() {
      const count = myMatches.length;
      const navBadge = document.getElementById('nav-chat-badge');
      const bottomDot = document.getElementById('nav-bottom-badge');

      if (count > 0) {
        navBadge.innerText = count;
        navBadge.classList.remove('hidden');
        bottomDot.classList.remove('hidden');
      } else {
        navBadge.classList.add('hidden');
        bottomDot.classList.add('hidden');
      }
    }

    /* ---------------------------------------------
       6. CHAT ATIVO COM ÁRVORE DE DIÁLOGO E ÁUDIOS
       --------------------------------------------- */
    function openChat(persona) {
      activeChatPersona = persona;
      switchToTab('active-chat');

      // Update Chat Header
      document.getElementById('chat-header-avatar').src = persona.photo;
      document.getElementById('chat-header-name').innerText = persona.name;
      document.getElementById('chat-header-status').innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> online agora`;

      renderChatHistory(persona.id);
      renderQuickReplies(persona);
    }

    function renderChatHistory(personaId) {
      const container = document.getElementById('chat-messages-container');
      container.innerHTML = '';

      const history = chatHistories[personaId] || [];

      history.forEach((msg, idx) => {
        const isUser = msg.sender === 'user';
        const msgDiv = document.createElement('div');
        msgDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start items-end space-x-2'} animate-fade-in`;

        if (!isUser) {
          msgDiv.innerHTML = `
            <img src="${activeChatPersona.photo}" class="w-7 h-7 rounded-full object-cover shrink-0">
            <div class="space-y-1.5 max-w-[82%]">
              <div class="p-3.5 rounded-2xl rounded-bl-sm bg-[#1A2230] border border-neutral-800 text-sm text-neutral-100 shadow-md">
                <p class="leading-relaxed">${msg.text}</p>
                ${msg.isAudio ? renderAudioPlayerBubble(msg.audioDuration, msg.audioFile, msg.audioText) : ''}
              </div>
              <span class="text-[10px] text-neutral-500 font-medium pl-1">${msg.time || 'Agora'}</span>
            </div>
          `;
        } else {
          msgDiv.innerHTML = `
            <div class="space-y-1.5 max-w-[82%]">
              <div class="p-3.5 rounded-2xl rounded-br-sm grad-brand text-sm text-white font-medium shadow-md shadow-pink-950/20">
                <p class="leading-relaxed">${msg.text}</p>
              </div>
              <div class="flex justify-end pr-1 text-[10px] text-neutral-400 font-medium">
                <span>${msg.time || 'Agora'}</span>
                <span class="text-emerald-400 ml-1">✓✓</span>
              </div>
            </div>
          `;
        }

        container.appendChild(msgDiv);
      });

      container.scrollTop = container.scrollHeight;
    }

    let currentPlayingAudio = null;
    let currentPlayingButton = null;

    function renderAudioPlayerBubble(duration = '0:12', audioFile = '', audioText = '') {
      const safeFile = audioFile || (activeChatPersona ? activeChatPersona.audioFile : '');
      const btnId = 'btn-audio-' + Math.random().toString(36).substr(2, 9);
      return `
        <div class="mt-2.5 pt-2 border-t border-white/10">
          <div class="flex items-center space-x-2.5 bg-black/40 p-2.5 rounded-xl border border-white/5 cursor-pointer hover:border-pink-500/40 transition-colors" onclick="playPersonaAudioFile('${safeFile}', '${btnId}', '${encodeURIComponent(audioText)}')">
            <button id="${btnId}" class="w-8 h-8 rounded-full grad-brand text-white flex items-center justify-center shrink-0 shadow">
              <svg class="w-4 h-4 fill-current ml-0.5 icon-play" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </button>
            <div class="flex-1 flex items-center space-x-1 h-5">
              <div class="waveform-bar h-2"></div>
              <div class="waveform-bar h-4"></div>
              <div class="waveform-bar h-5"></div>
              <div class="waveform-bar h-3"></div>
              <div class="waveform-bar h-4"></div>
              <div class="waveform-bar h-2"></div>
              <div class="waveform-bar h-4"></div>
              <div class="waveform-bar h-5"></div>
              <div class="waveform-bar h-3"></div>
              <div class="waveform-bar h-1"></div>
            </div>
            <span class="text-[11px] font-bold text-pink-400 font-mono">${duration}</span>
          </div>
          <span class="text-[10px] text-neutral-400 italic block mt-1">Toque para ouvir a voz real 🎧</span>
        </div>
      `;
    }

    function playPersonaAudioFile(audioFile, btnId, encodedText) {
      playSfx('send');

      if (currentPlayingAudio) {
        currentPlayingAudio.pause();
        currentPlayingAudio = null;
        if (currentPlayingButton) {
          currentPlayingButton.innerHTML = '<svg class="w-4 h-4 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        }
      }

      const btn = btnId ? document.getElementById(btnId) : null;
      let audioSrc = null;

      if (typeof AUDIO_ASSETS !== 'undefined' && AUDIO_ASSETS[audioFile]) {
        audioSrc = AUDIO_ASSETS[audioFile];
      } else if (audioFile) {
        audioSrc = 'audio/' + audioFile;
      }

      if (audioSrc) {
        const audio = new Audio(audioSrc);
        currentPlayingAudio = audio;
        currentPlayingButton = btn;

        if (btn) {
          btn.innerHTML = '<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
        }

        audio.play().catch(err => {
          console.warn('Erro ao tocar áudio MP3, fallback síntese:', err);
          fallbackVoiceSynth(decodeURIComponent(encodedText || ''));
        });

        audio.onended = () => {
          if (btn) {
            btn.innerHTML = '<svg class="w-4 h-4 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
          }
          currentPlayingAudio = null;
        };
      } else {
        fallbackVoiceSynth(decodeURIComponent(encodedText || ''));
      }
    }

    function fallbackVoiceSynth(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text || "Oi meu amor, que bom falar com você.");
        utter.lang = 'pt-BR';
        const voices = window.speechSynthesis.getVoices();
        const ptVoice = voices.find(v => v.lang.includes('pt') && (v.name.includes('Luciana') || v.name.includes('Maria') || v.name.includes('Yara') || v.name.includes('Francisca')));
        if (ptVoice) utter.voice = ptVoice;
        utter.rate = 1.0;
        utter.pitch = 1.15;
        window.speechSynthesis.speak(utter);
      }
    }

    function playPersonaAudioCurrent() {
      if (activeChatPersona) {
        playPersonaAudioFile(activeChatPersona.audioFile, null, encodeURIComponent(activeChatPersona.audioText));
      }
    }

    function playQuickSample(personaId) {
      const p = PERSONAS_DATA.find(x => x.id === personaId);
      if (p) {
        playPersonaAudioFile(p.audioFile, null, encodeURIComponent(p.audioText));
      }
    }

    /* Respostas Rápidas Interativas (Árvore de Diálogo) */
    function renderQuickReplies(persona) {
      const container = document.getElementById('quick-replies-container');
      container.innerHTML = '';

      const tree = persona.dialogueTree;
      const history = chatHistories[persona.id] || [];
      const userMsgCount = history.filter(m => m.sender === 'user').length;

      let currentStep = 'start';
      if (userMsgCount === 1) currentStep = history[history.length - 2]?.nextStep || 'pergunta_rotina';
      if (userMsgCount >= 2) currentStep = 'final';

      const stepData = tree[currentStep] || tree['start'];

      if (stepData.isCTA) {
        container.innerHTML = `
          <button onclick="handleWhatsAppConversion()" class="w-full py-3 px-4 rounded-xl grad-brand text-white font-extrabold text-xs shadow-lg flex items-center justify-center space-x-2 active:scale-95 transition-all">
            <span>CONECTAR COM ${persona.name.toUpperCase()} NO WHATSAPP</span>
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2z"/></svg>
          </button>
        `;
        return;
      }

      if (stepData.options) {
        stepData.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = `px-3.5 py-2 rounded-xl bg-[#1D2534] border border-pink-500/30 text-xs font-semibold text-pink-300 hover:bg-[#FE3C72] hover:text-white shrink-0 active:scale-95 transition-all`;
          btn.innerText = opt.label;
          btn.onclick = () => selectDialogueOption(persona, opt);
          container.appendChild(btn);
        });
      }
    }

    function selectDialogueOption(persona, option) {
      sendUserMessage(persona, option.label, option.next);
    }

    function sendCustomMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !activeChatPersona) return;
      input.value = '';
      sendUserMessage(activeChatPersona, text, 'pergunta_rotina');
    }

    function sendUserMessage(persona, text, nextStepKey) {
      playSfx('send');
      const history = chatHistories[persona.id] = chatHistories[persona.id] || [];

      history.push({
        sender: 'user',
        text: text,
        time: 'Agora',
        nextStep: nextStepKey
      });

      renderChatHistory(persona.id);
      document.getElementById('quick-replies-container').innerHTML = '';

      // Mostra status de digitando...
      const statusEl = document.getElementById('chat-header-status');
      statusEl.innerHTML = `<span class="text-pink-400 font-bold animate-pulse">digitando resposta...</span>`;

      // Resposta dinâmica da persona após 1.2 segundos
      setTimeout(() => {
        playSfx('push');
        statusEl.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> online agora`;

        const stepNode = persona.dialogueTree[nextStepKey] || persona.dialogueTree['final'];
        const replyText = stepNode.reply || 'Adorei conversar com você! Me passa seu zap pra gente falar direto.';

        history.push({
          sender: 'persona',
          text: replyText,
          time: 'Agora',
          isAudio: stepNode.hasAudio || false,
          audioDuration: persona.audioDuration,
          audioText: persona.audioText
        });

        renderChatHistory(persona.id);
        renderQuickReplies(persona);
      }, 1200);
    }

    function handleWhatsAppConversion() {
      playSfx('match');
      const name = activeChatPersona ? activeChatPersona.name : "você";
      const encodedMsg = encodeURIComponent(
        `Olá ${name}! Acabamos de dar MATCH no Namoro Virtual IA! Adorei suas mensagens e quero continuar nossa conversa por aqui 🔥`
      );
      window.open(`https://api.whatsapp.com/send?text=${encodedMsg}`, '_blank');
    }

    /* ---------------------------------------------
       7. NAVEGAÇÃO DE ABAS (DECK / INBOX / CHAT)
       --------------------------------------------- */
    function switchToTab(tab) {
      const viewDeck = document.getElementById('view-deck');
      const viewInbox = document.getElementById('view-inbox');
      const viewChat = document.getElementById('view-chat');
      const btnDeck = document.getElementById('nav-btn-deck');
      const btnChats = document.getElementById('nav-btn-chats');

      if (tab === 'deck') {
        viewDeck.classList.remove('hidden');
        viewInbox.classList.add('hidden');
        viewChat.classList.add('hidden');
        btnDeck.className = 'flex flex-col items-center justify-center text-pink-500 transition-colors';
        btnChats.className = 'relative flex flex-col items-center justify-center text-neutral-400 hover:text-white transition-colors';
      } else if (tab === 'chats') {
        viewDeck.classList.add('hidden');
        viewInbox.classList.remove('hidden');
        viewChat.classList.add('hidden');
        btnDeck.className = 'flex flex-col items-center justify-center text-neutral-400 hover:text-white transition-colors';
        btnChats.className = 'relative flex flex-col items-center justify-center text-pink-500 transition-colors';
        renderInboxList();
      } else if (tab === 'active-chat') {
        viewDeck.classList.add('hidden');
        viewInbox.classList.add('hidden');
        viewChat.classList.remove('hidden');
        btnDeck.className = 'flex flex-col items-center justify-center text-neutral-400 hover:text-white transition-colors';
        btnChats.className = 'relative flex flex-col items-center justify-center text-pink-500 transition-colors';
      }
    }

    function renderInboxList() {
      // Carousel
      const carousel = document.getElementById('matches-carousel');
      carousel.innerHTML = '';
      if (myMatches.length === 0) {
        carousel.innerHTML = `<span class="text-xs text-neutral-500 italic">Dê likes no Explorar para ver matches aqui!</span>`;
      } else {
        myMatches.forEach(p => {
          const item = document.createElement('div');
          item.className = 'flex flex-col items-center space-y-1 shrink-0 cursor-pointer';
          item.onclick = () => openChat(p);
          item.innerHTML = `
            <div class="relative">
              <img src="${p.photo}" class="w-14 h-14 rounded-full object-cover border-2 border-[#FE3C72] shadow">
              <span class="absolute bottom-0 right-0 w-3.5 h-3.5 rounded-full bg-emerald-500 border-2 border-[#0B0E14]"></span>
            </div>
            <span class="text-[11px] font-bold text-neutral-200 truncate w-14 text-center">${p.name}</span>
          `;
          carousel.appendChild(item);
        });
      }

      // List
      const list = document.getElementById('inbox-list');
      list.innerHTML = '';
      if (myMatches.length === 0) {
        list.innerHTML = `
          <div class="p-8 text-center text-neutral-500 space-y-2">
            <span class="text-3xl">💌</span>
            <p class="text-xs">Nenhuma mensagem ainda. Volte para o feed e dê like nos perfis!</p>
          </div>
        `;
        return;
      }

      myMatches.forEach(p => {
        const history = chatHistories[p.id] || [];
        const lastMsg = history[history.length - 1] || { text: p.firstMessage, time: 'Agora' };

        const row = document.createElement('div');
        row.className = 'p-4 flex items-center space-x-3 hover:bg-[#161C26] cursor-pointer transition-colors';
        row.onclick = () => openChat(p);
        row.innerHTML = `
          <div class="relative shrink-0">
            <img src="${p.photo}" class="w-13 h-13 rounded-full object-cover border border-neutral-700">
            <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-500 border-2 border-[#0B0E14]"></span>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <h4 class="font-extrabold text-sm text-white truncate">${p.name}</h4>
              <span class="text-[10px] text-pink-400 font-bold">${lastMsg.time || 'Agora'}</span>
            </div>
            <p class="text-xs text-neutral-400 truncate">${lastMsg.text}</p>
          </div>
        `;
        list.appendChild(row);
      });
    }

    // Inicialização ao carregar
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
